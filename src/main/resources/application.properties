# 本地运行使用固定端口；测试环境使用 Spring MockMvc / 随机端口不受影响
server.port=8080
spring.application.name=battery-safety-monitor

# ===== 电池安全监控规则配置 =====
# 支持的协议版本：v1 不上报绝缘；v2 必填 insulationKOhm
battery.monitor.supported-protocols=v1,v2

# 传感器量程（超出即拒绝，原因 OUT_OF_RANGE）
battery.monitor.range.min-voltage=2.0
battery.monitor.range.max-voltage=5.0
battery.monitor.range.min-current=-500.0
battery.monitor.range.max-current=500.0
battery.monitor.range.min-temp=-40.0
battery.monitor.range.max-temp=85.0
battery.monitor.range.min-insulation=0.0
battery.monitor.range.max-insulation=100000.0

# 连续采样窗口
battery.monitor.window.size-ms=60000
battery.monitor.window.min-samples=3

# 告警阈值（临界值采用 >= / <= 判定）
battery.monitor.thresholds.temp-warn-c=45.0
battery.monitor.thresholds.temp-crit-c=60.0
battery.monitor.thresholds.over-v-warn=4.20
battery.monitor.thresholds.over-v-crit=4.30
battery.monitor.thresholds.under-v-warn=3.20
battery.monitor.thresholds.under-v-crit=2.80
battery.monitor.thresholds.over-a-warn=200.0
battery.monitor.thresholds.over-a-crit=300.0
battery.monitor.thresholds.insulation-warn-k=500.0
battery.monitor.thresholds.insulation-crit-k=100.0
battery.monitor.thresholds.thermal-rise-per-sec=1.0
battery.monitor.thresholds.thermal-temp-base-c=50.0

# 持续时间门槛（故障必须连续违例达到才成立）
battery.monitor.duration.warn-hold-ms=10000
battery.monitor.duration.crit-hold-ms=3000
battery.monitor.duration.recovery-hold-ms=15000

# 同一故障外部告警抑制窗口
battery.monitor.suppression.window-ms=60000

# 启动时是否运行内置模拟遥测演示（本地：--battery.simulator.enabled=true）
battery.simulator.enabled=false

logging.level.com.github.highcumontoa=INFO
